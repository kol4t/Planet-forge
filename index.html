<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Planet Forge</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#060b0d" />
  <style>
:root {
  --bg-deep: #05090b;
  --bg-mid: #0b1a1d;
  --teal: #72c4b6;
  --gold: #d8b463;
  --text: #dfe7e1;
  --danger: #e08a6d;
  color-scheme: dark;
}

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 45%, #0e2226 0%, var(--bg-mid) 35%, var(--bg-deep) 80%);
  background-color: var(--bg-deep);
  color: var(--text);
  font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
  /* brak przewijania, podświetlania i zaznaczania przy dotyku (iPad/Safari) */
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

#planet, #ui {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}
#planet { display: block; z-index: 0; }
#ui { z-index: 1; }
#ui canvas { display: block; touch-action: none; }

#safe-probe {
  position: fixed;
  visibility: hidden;
  pointer-events: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#status {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  padding: 14px 22px;
  border-radius: 999px;
  background: rgba(10, 20, 23, 0.9);
  border: 1px solid #2b4846;
  color: var(--teal);
  font-size: 15px;
  letter-spacing: 0.02em;
  max-width: min(90vw, 520px);
  text-align: center;
}
#status.error { color: var(--danger); border-color: var(--danger); border-radius: 14px; }
#status[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="planet" aria-label="Planeta 3D — przeciągnij palcem, aby obrócić"></canvas>
  <div id="ui"></div>
  <div id="safe-probe" aria-hidden="true"></div>
  <div id="status" role="status">Przygotowywanie ekspedycji…</div>
  <noscript>Planet Forge wymaga włączonej obsługi JavaScript.</noscript>
  <!--APP_SCRIPT-->
</body>
</html>

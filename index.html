<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Planet Forge</title>
  <!-- PWA: „Udostępnij → Do ekranu początkowego” otwiera grę na pełnym ekranie. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Pasek statusu przezroczysty: gra rysuje się pod nim, a HUD omija go dzięki safe-area. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Planet Forge" />
  <meta name="theme-color" content="#060b0d" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <style>
:root {
  --bg-deep: #05090b;
  --bg-mid: #0b1a1d;
  --teal: #72c4b6;
  --gold: #d8b463;
  --text: #dfe7e1;
  --danger: #e08a6d;
  color-scheme: dark;
}

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(ellipse at 42% 40%, #0c1d2a 0%, #08121c 38%, var(--bg-deep) 85%);
  background-color: var(--bg-deep);
  color: var(--text);
  font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
  /* brak przewijania, podświetlania i zaznaczania przy dotyku (iPad/Safari) */
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

#planet, #ui {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}
#planet { display: block; z-index: 0; }

/* Tło kosmosu (src/planet-renderer/spaceBackground.ts): warstwy rysowane raz, paralaksa przez transform. */
#space { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
#space .space-layer { position: absolute; left: 0; top: 0; transform: translate3d(-28px, -28px, 0); will-change: transform; }
#space .space-body { position: absolute; }
#space .space-twinkle {
  position: absolute;
  border-radius: 50%;
  box-shadow: 0 0 4px 1px currentColor;
  opacity: 0.5;
  animation: pf-twinkle 6s ease-in-out infinite;
}
@keyframes pf-twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.95; } }
#space .space-meteor {
  position: absolute;
  left: 0;
  top: 0;
  width: 140px;
  height: 1.5px;
  border-radius: 1px;
  transform-origin: 100% 50%;
  background: linear-gradient(90deg, rgba(200, 235, 255, 0), rgba(220, 245, 255, 0.85));
  opacity: 0;
}
@media (prefers-reduced-motion: reduce) {
  #space .space-twinkle { animation: none; }
  #space .space-meteor { display: none; }
}
#ui { z-index: 1; }
#ui canvas { display: block; touch-action: none; }

#safe-probe {
  position: fixed;
  visibility: hidden;
  pointer-events: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#status {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  padding: 14px 22px;
  border-radius: 999px;
  background: rgba(10, 20, 23, 0.9);
  border: 1px solid #2b4846;
  color: var(--teal);
  font-size: 15px;
  letter-spacing: 0.02em;
  max-width: min(90vw, 520px);
  text-align: center;
}
#status.error { color: var(--danger); border-color: var(--danger); border-radius: 14px; }
#status[hidden] { display: none; }

/* Panel z polem tekstowym (eksport/import zapisu) — src/game/ui/textPanel.ts */
#text-panel {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background: rgba(0, 0, 0, 0.6);
  touch-action: auto;
}
#text-panel .tp-box {
  width: min(100%, 480px);
  box-sizing: border-box;
  padding: 20px;
  border-radius: 16px;
  border: 1px solid rgba(216, 180, 99, 0.7);
  background: #0a1417;
  color: var(--text);
}
#text-panel h2 {
  margin: 0 0 6px;
  font: 400 22px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  color: var(--gold);
}
#text-panel .tp-hint { margin: 0 0 12px; font-size: 14px; line-height: 1.45; color: #8ea6a0; }
#text-panel textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #2b4846;
  background: #05090b;
  color: var(--text);
  font: 13px "SF Mono", Menlo, Consolas, monospace;
  word-break: break-all;
  resize: none;
  -webkit-user-select: text;
  user-select: text;
}
#text-panel textarea:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
#text-panel .tp-error { margin: 10px 0 0; font-size: 14px; color: var(--danger); }
#text-panel .tp-error[hidden] { display: none; }
#text-panel .tp-actions { display: flex; gap: 12px; margin-top: 16px; }
#text-panel button {
  flex: 1;
  min-height: 44px;
  border-radius: 10px;
  font: 600 15px "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
}
#text-panel button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
#text-panel .tp-secondary { border: 1.5px solid var(--teal); background: #1a2b2d; color: var(--teal); }
#text-panel .tp-primary { border: 0; background: var(--gold); color: #0c1513; }
/* Okno „Diagnostyka i zgłoszenia” — src/game/ui/feedbackPanel.ts */
#text-panel .fb-box { max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#text-panel .fb-kinds { display: flex; gap: 8px; margin: 6px 0 12px; }
#text-panel .fb-kinds button { border: 1.5px solid var(--teal); background: #1a2b2d; color: var(--teal); font-size: 14px; }
#text-panel .fb-kinds button.on { background: var(--teal); color: #0c1513; }
#text-panel .fb-title {
  width: 100%;
  box-sizing: border-box;
  min-height: 44px;
  margin-bottom: 10px;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #2b4846;
  background: #05090b;
  color: var(--text);
  font: 15px "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
}
#text-panel .fb-title:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
#text-panel .fb-text { font: 15px "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; word-break: normal; }
#text-panel .fb-check { display: flex; gap: 10px; align-items: center; min-height: 44px; font-size: 14px; color: var(--text); }
#text-panel .fb-check input { width: 22px; height: 22px; flex: none; accent-color: var(--teal); }
#text-panel .fb-details { margin: 4px 0 8px; font-size: 14px; color: #8ea6a0; }
#text-panel .fb-details summary { min-height: 32px; cursor: pointer; }
#text-panel .tp-error.ok { color: var(--teal); }
#text-panel .tp-error a { color: var(--gold); }
#text-panel .fb-clear { display: block; flex: none; width: auto; margin: 12px auto 0; padding: 0 12px; border: 0; background: none; color: #8ea6a0; font-size: 14px; }
/* Okno „Szukaj układu” — src/game/ui/searchPanel.ts */
#text-panel .sp-box { display: flex; flex-direction: column; height: min(100%, 640px); }
#text-panel .sp-filters { flex-wrap: wrap; }
#text-panel .sp-filters button { flex: 1 1 auto; }
#text-panel .sp-list { flex: 1 1 auto; min-height: 120px; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 6px; }
#text-panel .sp-row {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 8px 12px;
  border: 1px solid #2b4846;
  background: #0d1a1d;
  color: var(--text);
  text-align: left;
}
#text-panel .sp-name { font-size: 15px; color: var(--text); }
#text-panel .ap-status, #text-panel .ap-next, #text-panel .ap-comet, #text-panel .cp-next { white-space: pre-line; }
#text-panel .tp-actions[hidden], #text-panel .tp-hint[hidden] { display: none; }
#text-panel .ap-head { margin: 14px 0 6px; font: 600 12px "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; letter-spacing: 1.2px; text-transform: uppercase; color: #8ea6a0; }
#text-panel .ap-head:first-of-type { margin-top: 4px; }
#text-panel .tp-actions + .ap-head { border-top: 1px solid #2b4846; padding-top: 14px; }
#text-panel .tr-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 6px 0 10px; font-size: 15px; color: var(--text); }
#text-panel .tr-value { color: var(--gold); font-variant-numeric: tabular-nums; }
#text-panel .tr-row input { grid-column: 1 / -1; width: 100%; height: 44px; margin: 0; accent-color: var(--teal); }
#text-panel .tr-quick button { flex: 1 1 auto; }
#text-panel .tp-primary:disabled { opacity: 0.45; }
#text-panel .sp-info { font: 400 13px "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; color: #8ea6a0; }
#building-card {
  position: fixed; z-index: 20; box-sizing: border-box; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 14px 16px 12px; border: 1px solid rgba(95, 242, 224, 0.45); border-radius: 14px;
  background: rgba(9, 20, 22, 0.9); color: var(--text); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  font: 14px "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
}
#building-card header { display: flex; justify-content: space-between; gap: 8px; }
#building-card h2 { margin: 0; font: 400 22px Georgia, "Times New Roman", serif; color: var(--gold); }
#building-card .bc-level { margin: 2px 0 0; font-weight: 600; color: #5ff2e0; }
#building-card .bc-close { flex: none; width: 44px; height: 44px; margin: -8px -10px 0 0; border: 0; background: none; color: #8ea6a0; font-size: 26px; }
#building-card .bc-desc { margin: 8px 0 10px; color: #8ea6a0; font-size: 13px; line-height: 1.4; }
#building-card .bc-params { border-top: 1px solid #2b4846; }
#building-card .bc-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1d3133; color: #8ea6a0; }
#building-card .bc-row b { text-align: right; color: var(--text); }
#building-card .bc-row b.teal { color: #5ff2e0; }
#building-card .bc-row b.warn { color: var(--gold); }
#building-card .bc-next { padding: 8px 0; font-size: 13px; line-height: 1.4; }
#building-card .bc-next span { display: block; margin-bottom: 2px; color: #8ea6a0; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; }
#building-card h3 { margin: 12px 0 6px; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: #5ff2e0; }
#building-card .bc-stages { margin: 0; padding: 0; list-style: none; }
#building-card .bc-stage { display: flex; gap: 10px; padding: 6px 0; color: #5f7873; }
#building-card .bc-stage b { display: block; font-weight: 600; }
#building-card .bc-stage small { color: inherit; font-size: 12px; }
#building-card .bc-stage p { margin: 3px 0 0; font-size: 12px; line-height: 1.35; color: #8ea6a0; }
#building-card .bc-dot { flex: none; width: 12px; height: 12px; margin-top: 4px; border-radius: 50%; border: 2px solid currentColor; box-sizing: border-box; }
#building-card .bc-stage.done { color: #9cc7c0; }
#building-card .bc-stage.done .bc-dot { background: currentColor; }
#building-card .bc-stage.current { color: #5ff2e0; }
#building-card .bc-stage.current .bc-dot { background: #5ff2e0; box-shadow: 0 0 8px #5ff2e0; }
#building-card .bc-stage.next { color: var(--gold); }
#building-card .bc-stage.soon { opacity: 0.55; }
#building-card .bc-choose { width: 100%; min-height: 44px; margin-top: 10px; border: 0; border-radius: 10px; background: var(--gold); color: #0c1513; font: 600 15px "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; }
#building-card .bc-choose.on { background: #1a2b2d; border: 1.5px solid var(--gold); color: var(--gold); }
#building-card .bc-hint { margin: 6px 0 0; font-size: 12px; line-height: 1.4; color: #8ea6a0; }
  </style>
</head>
<body>
  <canvas id="planet" aria-label="Planeta 3D — przeciągnij palcem, aby obrócić"></canvas>
  <div id="ui"></div>
  <div id="safe-probe" aria-hidden="true"></div>
  <div id="status" role="status">Przygotowywanie ekspedycji…</div>
  <noscript>Planet Forge wymaga włączonej obsługi JavaScript.</noscript>
  <!--APP_SCRIPT-->
</body>
</html>

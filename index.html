<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Planet Forge</title>
  <!-- PWA: „Udostępnij → Do ekranu początkowego” otwiera grę na pełnym ekranie. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Pasek statusu przezroczysty: gra rysuje się pod nim, a HUD omija go dzięki safe-area. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Planet Forge" />
  <meta name="theme-color" content="#060b0d" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <style>
:root {
  --bg-deep: #05090b;
  --bg-mid: #0b1a1d;
  --teal: #72c4b6;
  --gold: #d8b463;
  --text: #dfe7e1;
  --danger: #e08a6d;
  color-scheme: dark;
}

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 45%, #0e2226 0%, var(--bg-mid) 35%, var(--bg-deep) 80%);
  background-color: var(--bg-deep);
  color: var(--text);
  font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
  /* brak przewijania, podświetlania i zaznaczania przy dotyku (iPad/Safari) */
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

#planet, #ui {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}
#planet { display: block; z-index: 0; }
#ui { z-index: 1; }
#ui canvas { display: block; touch-action: none; }

#safe-probe {
  position: fixed;
  visibility: hidden;
  pointer-events: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#status {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  padding: 14px 22px;
  border-radius: 999px;
  background: rgba(10, 20, 23, 0.9);
  border: 1px solid #2b4846;
  color: var(--teal);
  font-size: 15px;
  letter-spacing: 0.02em;
  max-width: min(90vw, 520px);
  text-align: center;
}
#status.error { color: var(--danger); border-color: var(--danger); border-radius: 14px; }
#status[hidden] { display: none; }

/* Panel z polem tekstowym (eksport/import zapisu) — src/game/ui/textPanel.ts */
#text-panel {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background: rgba(0, 0, 0, 0.6);
  touch-action: auto;
}
#text-panel .tp-box {
  width: min(100%, 480px);
  box-sizing: border-box;
  padding: 20px;
  border-radius: 16px;
  border: 1px solid rgba(216, 180, 99, 0.7);
  background: #0a1417;
  color: var(--text);
}
#text-panel h2 {
  margin: 0 0 6px;
  font: 400 22px "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  color: var(--gold);
}
#text-panel .tp-hint { margin: 0 0 12px; font-size: 14px; line-height: 1.45; color: #8ea6a0; }
#text-panel textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #2b4846;
  background: #05090b;
  color: var(--text);
  font: 13px "SF Mono", Menlo, Consolas, monospace;
  word-break: break-all;
  resize: none;
  -webkit-user-select: text;
  user-select: text;
}
#text-panel textarea:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
#text-panel .tp-error { margin: 10px 0 0; font-size: 14px; color: var(--danger); }
#text-panel .tp-error[hidden] { display: none; }
#text-panel .tp-actions { display: flex; gap: 12px; margin-top: 16px; }
#text-panel button {
  flex: 1;
  min-height: 44px;
  border-radius: 10px;
  font: 600 15px "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
}
#text-panel button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
#text-panel .tp-secondary { border: 1.5px solid var(--teal); background: #1a2b2d; color: var(--teal); }
#text-panel .tp-primary { border: 0; background: var(--gold); color: #0c1513; }
  </style>
</head>
<body>
  <canvas id="planet" aria-label="Planeta 3D — przeciągnij palcem, aby obrócić"></canvas>
  <div id="ui"></div>
  <div id="safe-probe" aria-hidden="true"></div>
  <div id="status" role="status">Przygotowywanie ekspedycji…</div>
  <noscript>Planet Forge wymaga włączonej obsługi JavaScript.</noscript>
  <!--APP_SCRIPT-->
</body>
</html>

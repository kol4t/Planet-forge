name: Sugestia, propozycja zmiany
description: Pomysł na zmianę albo nową rzecz w grze. Najwygodniej zgłosić z gry — Ustawienia → Zgłoś.
title: "[Sugestia] "
labels: ["enhancement"]
body:
  - type: textarea
    id: opis
    attributes:
      label: Co proponujesz?
      description: Co zmienić i dlaczego — co by to dało w grze.
    validations:
      required: true
  - type: textarea
    id: diagnostyka
    attributes:
      label: Wersja i urządzenie
      description: Wypełniane przez grę.
      render: text
